<div class="film-strip"></div>
<nav class="navbar navbar-expand-lg navbar-dark cinema-navbar">
    <div class="container-fluid">
        <a class="navbar-brand cinema-brand">
            <i class="fa-solid fa-clapperboard cinema-brand-icon"></i>
            <span class="cinema-brand-text">IIGNACC <em>Cinemas</em></span>
        </a>
        <div class="navbar-collapse" id="navbarSupportedContent">
            <form class="d-flex ms-auto cinema-search" role="search">
                <input class="form-control me-2"
                    type="search"
                    placeholder="Buscar película..."
                    aria-label="Search">
                <button class="btn cinema-btn" type="submit"><i class="fa-solid fa-ticket"></i> Buscar</button>
            </form>
        </div>
    </div>
</nav>
<div class="film-strip"></div>

<div class="container my-4">
    <div class="row mb-4">
        <h3 class="cinema-title"><i class="fa-solid fa-clapperboard"></i> Ahora en Cartelera</h3>
    </div>
    <div class="row mb-5">
        <div class="col">
            <div class="cinema-screen-frame">
                <div class="screen-glow"></div>
                <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" style="width: 100%;">
                    <div class="carousel-indicators">
                        <button
                          *ngFor="let peli of peliculas; let i = index"
                            type="button"
                            data-bs-target="#carouselExampleCaptions"
                            [attr.data-bs-slide-to]="i"
                            [ngClass]="{ 'active': i === 0 }"
                            [attr.aria-current]="i === 0 ? 'true' : null"
                            [attr.aria-label]="'Slide ' + (i + 1)"
                        ></button>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item" *ngFor="let pelicula of peliculas; let i = index" [ngClass]="{ 'active': i === 0 }">
                            <img [src]="'https://image.tmdb.org/t/p/original'+pelicula.backdrop_path" class="d-block mx-auto" [alt]="pelicula.id" style="width: 100%;">
                            <div class="carousel-caption d-none d-md-block cinema-caption">
                                <h5>{{pelicula.title}}</h5>
                                <p>{{pelicula.overview | slice:0:80}}...</p>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previo</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <h3 class="cinema-title"><i class="fa-solid fa-film"></i> Películas</h3>
    </div>
    <div class="row">
        <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-4" *ngFor="let pelicula of peliculas">
            <div class="movie-ticket">
                <div class="poster-wrap">
                    <img [src]="'https://image.tmdb.org/t/p/w500'+pelicula.poster_path" class="poster-img">
                    <div class="poster-overlay">
                        <i class="fa-solid fa-play play-icon"></i>
                    </div>
                    <span class="now-showing-badge">En cartelera</span>
                </div>
                <div class="ticket-perforation"></div>
                <div class="ticket-body">
                    <h5 class="ticket-title">{{ pelicula.title }}</h5>
                    <app-rating [rating]="pelicula.vote_average"></app-rating>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="cinema-footer">
    <div class="film-strip"></div>
    <p>&copy; IIGNACC Cinemas &mdash; Tu sala de estreno favorita</p>
</footer>
