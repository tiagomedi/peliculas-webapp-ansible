<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand">
            <img src="../assets/Blockstellart.png" width="180" alt="Blockstellart logo">
            - Ansible
        </a>
        <div class="navbar-collapse" id="navbarSupportedContent">
            <form class="d-flex ms-auto" role="search">
                <input class="form-control me-2 w-120" 
                    type="search" 
                    placeholder="Search" 
                    aria-label="Search">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>
<div class="container my-4">
    <div class="row mb-4">
        <h3>Cartelera</h3>
    </div>
    <div class="row mb-5">
        <div class="col">
            <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" style="width: 100%;">
                <div class="carousel-indicators">
                    <button
                      *ngFor="let peli of peliculas; let i = index"
                        type="button"
                        data-bs-target="#carouselExampleCaptions"
                        [attr.data-bs-slide-to]="i"
                        [ngClass]="{ 'active': i === 0 }"
                        [attr.aria-current]="i === 0 ? 'true' : null"
                        [attr.aria-label]="'Slide ' + (i + 1)"
                    ></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item" *ngFor="let pelicula of peliculas; let i = index" [ngClass]="{ 'active': i === 0 }">
                        <img [src]="'https://image.tmdb.org/t/p/original'+pelicula.backdrop_path" class="d-block mx-auto" [alt]="pelicula.id" style="width: 100%;">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>{{pelicula.title}}</h5>
                            <p>{{pelicula.overview | slice:0:80}}...</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previo</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <h3>Películas</h3>
    </div>
    <div class="row">
        <div class="col  mb-3" *ngFor="let pelicula of peliculas">
            <div class="card" style="width: 18rem;">
                <img [src]="'https://image.tmdb.org/t/p/w500'+pelicula.poster_path" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">{{ pelicula.title }}</h5>
                    <app-rating [rating]="pelicula.vote_average"></app-rating>
                    <!-- <p class="card-text">{{pelicula.vote_average | number:'1.1-2'}}</p> -->
                    <div class="d-flex justify-content-evenly">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
