<div class="d-inline-block">
    <i
    *ngFor="let star of stars"
    [ngClass]="{
    'fa-solid fa-star text-warning': star <= filledStars,
    'fa-regular fa-star text-warning': star > filledStars
    }"
    style="font-size: 1.5rem; margin-right: 3px;"
    aria-hidden="true"
    >
    </i>
</div>
